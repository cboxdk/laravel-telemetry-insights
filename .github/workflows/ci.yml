name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: P${{ matrix.php }} · L${{ matrix.laravel }} · ${{ matrix.stability }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        exclude:
          # Keep the matrix honest without making it enormous: the oldest PHP
          # only needs the oldest Laravel, the newest only the newest.
          - php: '8.5'
            laravel: '12.*'
          - php: '8.3'
            laravel: '13.*'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, bcmath, intl, fileinfo, sqlite3
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      # The docs-screenshot suite drives a real browser. Without this the
      # whole run died on PlaywrightNotInstalledException — the matrix was
      # red on main before this step existed, so nothing else it covered was
      # being read either.
      - name: Install Playwright
        run: npm install playwright && npx playwright install --with-deps chromium

      - name: Pest
        run: vendor/bin/pest --ci

  static:
    name: pint · phpstan · supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, bcmath, intl, fileinfo, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --error-format=github --no-progress --memory-limit=1G

      - name: Audit
        run: composer audit --no-dev

      - name: License check
        run: composer license-check

      - name: SBOM is current
        run: |
          composer sbom
          git diff --exit-code sbom.json
